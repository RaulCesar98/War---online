<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAR · Facções</title>
  <meta name="description" content="Jogo de estratégia WAR multiplayer: domine comunidades, cumpra seu objetivo e vença seus amigos.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="conn" class="conn hidden">Reconectando…</div>
  <div id="toast" class="toast"></div>
  <button id="muteFab" class="fab" title="Ligar ou desligar os sons" aria-label="Sons">🔊</button>

  <!-- INÍCIO -->
  <section id="home" class="screen center hidden">
    <div class="card home-card">
      <h1 class="logo">WAR</h1>
      <p class="sub">Facções em disputa pelas comunidades da cidade · 2 a 10 jogadores</p>
      <label class="field">Seu nome
        <input id="nameInput" maxlength="16" placeholder="Ex.: Napoleão" autocomplete="off">
      </label>
      <button id="createBtn" class="primary big">Criar sala</button>
      <div class="or"><span>ou entre numa sala</span></div>
      <div class="join-row">
        <input id="codeInput" maxlength="4" placeholder="CÓDIGO" autocomplete="off" spellcheck="false">
        <button id="joinBtn" class="big">Entrar</button>
      </div>
      <button id="rulesHomeBtn" class="link">📖 Regras do jogo</button>
    </div>
  </section>

  <!-- SALA DE ESPERA -->
  <section id="lobby" class="screen center hidden">
    <div class="card home-card">
      <p class="sub">Código da sala</p>
      <div id="lobbyCode" class="code"></div>
      <button id="copyLinkBtn" class="link">Copiar link de convite</button>
      <ul id="lobbyPlayers" class="lobby-players"></ul>
      <label class="toggle" id="expandedRow">
        <input type="checkbox" id="expandedChk">
        <span><b>Modo expandido</b><small>Árvore de tecnologia, armas construíveis e cartas de ação</small></span>
      </label>
      <label class="toggle rounds-row" id="roundsRow">
        <span><b>Duração</b><small>Com limite, quem tiver mais pontos ao fim da última rodada vence</small></span>
        <select id="roundsSel"></select>
      </label>
      <p id="lobbyHint" class="hint"></p>
      <button id="startBtn" class="primary big">Iniciar partida</button>
      <button id="rulesLobbyBtn" class="link">📖 Ver regras</button>
      <button id="leaveLobbyBtn" class="link">Sair da sala</button>
    </div>
  </section>

  <!-- JOGO -->
  <section id="game" class="screen hidden">
    <header id="topbar" class="topbar"></header>
    <div class="game-layout">
      <div class="map-col">
        <div class="map-wrap">
          <svg id="map" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg>
          <div id="ticker" class="ticker" aria-live="polite"></div>
        </div>
        <div id="legend" class="legend"></div>
      </div>
      <aside class="side">
        <div class="turn-box">
          <div id="banner" class="banner"></div>
          <div id="timer" class="timer hidden"><div id="timerFill" class="timer-fill"></div><span id="timerText"></span></div>
        </div>
        <div id="actions" class="panel"></div>
        <div id="combat" class="panel combat hidden"></div>
        <div class="panel kit">
          <div class="tabs" id="kitTabs">
            <button class="tab active" data-kit="obj">🎯 Objetivo</button>
            <button class="tab" data-kit="cards">🃏 Cartas <span id="cardsCount" class="count"></span></button>
            <button class="tab hidden" data-kit="acts">🎴 Ação <span id="actsCount" class="count"></span></button>
            <button class="tab hidden" data-kit="res">🔬 Pesquisa</button>
          </div>
          <div class="kit-pane" data-pane="obj">
            <div id="objective" class="objective"></div>
            <button id="eyeBtn" class="link small">ocultar</button>
          </div>
          <div class="kit-pane hidden" data-pane="cards">
            <div id="tradeStatus" class="trade-status"></div>
            <div id="hand" class="hand"></div>
            <div id="tradeGuide" class="trade-guide"></div>
            <p id="tradeInfo" class="muted pane-note"></p>
            <button id="tradeBtn" class="primary hidden">Trocar cartas</button>
          </div>
          <div class="kit-pane hidden" data-pane="acts">
            <div id="actionHand" class="action-hand"></div>
            <p id="actionInfo" class="muted pane-note"></p>
          </div>
          <div class="kit-pane hidden" data-pane="res" id="research"></div>
        </div>
        <div id="players" class="panel"></div>
        <div class="panel">
          <div class="tabs">
            <button id="tabLog" class="tab active">Jogadas</button>
            <button id="tabChat" class="tab">Chat</button>
          </div>
          <div id="logBox" class="logbox"></div>
          <button id="historyLink" class="link small history-link">📜 Ver histórico completo</button>
          <form id="chatForm" class="chat-form hidden">
            <input id="chatInput" maxlength="200" placeholder="Mensagem…" autocomplete="off">
            <button class="primary">Enviar</button>
          </form>
        </div>
      </aside>
    </div>
  </section>

  <!-- HISTÓRICO -->
  <section id="history" class="history hidden" aria-label="Histórico da partida">
    <div class="history-inner">
      <header class="history-head">
        <button id="historyBack" class="mini">← Voltar ao mapa</button>
        <h2>📜 Histórico da partida</h2>
        <span id="historyCount" class="muted"></span>
      </header>
      <div id="historyStats" class="hstats"></div>
      <div class="hfilters">
        <div id="historyKinds" class="hkinds"></div>
        <div class="hfilter-row">
          <select id="historyPlayer"></select>
          <input id="historySearch" placeholder="Buscar comunidade ou jogador…" autocomplete="off">
        </div>
      </div>
      <div id="historyList" class="hlist"></div>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="sfx.js"></script>
  <script src="client.js"></script>
</body>
</html>
